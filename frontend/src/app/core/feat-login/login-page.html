<ng-container *transloco="let t">
  <main class="flex min-h-screen items-center justify-center bg-surface-50 p-4 dark:bg-surface-950">
    <div class="w-full max-w-sm rounded-2xl border border-surface-200 bg-surface-0 p-8 dark:border-surface-700 dark:bg-surface-900">
      <!-- The brand is the heading: the logo says the name, for eyes and for screen readers. -->
      <h1 class="mb-8 flex justify-center"><app-frontdesk-logo class="h-9" /></h1>

      <!-- novalidate: Signal Forms attach per field, so Angular never disables the browser's
           own bubbles; validation and messages come from the form schema instead. -->
      <form novalidate class="flex flex-col gap-4" (submit)="onSubmit($event)">
        <!-- Which tenant: a Kennung rather than a list, so no customer's name is shown before a
             login. Optional, because a super-user signs in without one; remembered from the last
             successful login at this browser. -->
        <p-inputgroup>
          <p-inputgroup-addon><i class="pi pi-building" aria-hidden="true"></i></p-inputgroup-addon>
          <p-floatlabel variant="on">
            <input pInputText id="tenant" type="text" autocomplete="organization" [formField]="loginForm.tenant" />
            <label for="tenant">{{ t('login.tenant') }}</label>
          </p-floatlabel>
        </p-inputgroup>

        <div class="flex flex-col gap-2">
          <p-inputgroup>
            <p-inputgroup-addon><i class="pi pi-user" aria-hidden="true"></i></p-inputgroup-addon>
            <p-floatlabel variant="on">
              <input pInputText id="username" type="text" autocomplete="username" [formField]="loginForm.username" />
              <label for="username">{{ t('login.username') }}</label>
            </p-floatlabel>
          </p-inputgroup>
          @if (loginForm.username().invalid()) {
            <p-message severity="error" variant="simple" size="small">{{ t('login.usernameRequired') }}</p-message>
          }
        </div>

        <div class="flex flex-col gap-2">
          <p-inputgroup>
            <p-inputgroup-addon><i class="pi pi-lock" aria-hidden="true"></i></p-inputgroup-addon>
            <p-floatlabel variant="on">
              <input pInputText id="password" type="password" autocomplete="current-password" [formField]="loginForm.password" />
              <label for="password">{{ t('login.password') }}</label>
            </p-floatlabel>
          </p-inputgroup>
          @if (loginForm.password().invalid()) {
            <p-message severity="error" variant="simple" size="small">{{ t('login.passwordRequired') }}</p-message>
          }
        </div>

        @if (hasLoginFailed()) {
          <p-message severity="error">{{ t('login.failed') }}</p-message>
        }

        <p-button type="submit" styleClass="w-full" [label]="t('login.submit')" [loading]="isSubmitting()" />
      </form>
    </div>
  </main>
</ng-container>
