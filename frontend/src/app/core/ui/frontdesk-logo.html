<svg
  xmlns="http://www.w3.org/2000/svg"
  [attr.viewBox]="wordmark() ? '0 0 172 40' : '0 0 40 40'"
  class="h-full w-auto"
  role="img"
  aria-label="frontdesk"
>
  <!-- The mark: a rounded tile with an inbox tray and a mail dropping in. -->
  <rect width="40" height="40" rx="10" [attr.fill]="onPrimary() ? 'var(--p-primary-contrast-color)' : 'var(--p-primary-color)'" />
  <g
    fill="none"
    [attr.stroke]="onPrimary() ? 'var(--p-primary-color)' : 'var(--p-primary-contrast-color)'"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M9 22h6l2.6 4h4.8l2.6-4h6v8.5a2.5 2.5 0 0 1-2.5 2.5h-17A2.5 2.5 0 0 1 9 30.5z" />
    <path d="M20 7.5V19" />
    <path d="M15.5 14.5 20 19l4.5-4.5" />
  </g>
  @if (wordmark()) {
    <!-- The wordmark takes the page's text colour and font. -->
    <text x="50" y="27.5" font-family="inherit" font-size="23" font-weight="600" letter-spacing="-0.4" fill="currentColor">frontdesk</text>
  }
</svg>
