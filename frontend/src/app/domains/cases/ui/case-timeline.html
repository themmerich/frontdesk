<ng-container *transloco="let t">
  <!-- Oldest step at the top, the newest at the bottom, so the trail reads like the case went. -->
  <p-timeline class="app-case-timeline" [value]="entries()" [attr.aria-label]="t('caseDetail.history')">
    <ng-template #marker let-entry>
      <span
        class="flex h-6 w-6 items-center justify-center rounded-full bg-surface-100 text-surface-600 dark:bg-surface-800 dark:text-surface-300"
      >
        <i class="text-xs!" [class]="entry.icon" aria-hidden="true"></i>
      </span>
    </ng-template>
    <ng-template #content let-entry>
      <div class="flex flex-col gap-0.5 pb-3 text-sm" [attr.data-event]="entry.event.type">
        <span>{{ entry.text }}</span>
        <span class="text-xs text-surface-500 dark:text-surface-400">
          @if (entry.event.actorName) {
            {{ entry.event.actorName }} ·
          }
          {{ entry.event.occurredAt | date: 'short' }}
        </span>
      </div>
    </ng-template>
  </p-timeline>
</ng-container>
