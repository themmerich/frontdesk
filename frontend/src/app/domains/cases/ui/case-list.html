<ng-container *transloco="let t">
  <p-table [value]="cases()" dataKey="id" sortField="receivedAt" [sortOrder]="-1">
    <ng-template #header>
      <tr>
        <th scope="col" pSortableColumn="sender">
          <div class="flex items-center gap-2">
            {{ t('cases.sender') }}
            <p-sorticon field="sender" />
            <p-columnfilter type="text" field="sender" display="menu" [placeholder]="t('cases.filter')" />
          </div>
        </th>
        <th scope="col" pSortableColumn="subject">
          <div class="flex items-center gap-2">
            {{ t('cases.subject') }}
            <p-sorticon field="subject" />
            <p-columnfilter type="text" field="subject" display="menu" [placeholder]="t('cases.filter')" />
          </div>
        </th>
        <th scope="col" pSortableColumn="receivedAt">
          <div class="flex items-center gap-2">
            {{ t('cases.receivedAt') }}
            <p-sorticon field="receivedAt" />
          </div>
        </th>
      </tr>
    </ng-template>
    <ng-template #body let-row>
      <tr>
        <td>{{ row.sender }}</td>
        <td>{{ row.subject }}</td>
        <td>{{ row.receivedAt | date: 'short' }}</td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="3">{{ t('cases.empty') }}</td>
      </tr>
    </ng-template>
  </p-table>
</ng-container>
