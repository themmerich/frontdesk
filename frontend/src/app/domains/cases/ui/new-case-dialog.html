<ng-container *transloco="let t">
  <!-- The form grows with every file picked, so the dialog is capped and scrolls inside itself:
       without it the buttons walk off the bottom of the screen. -->
  <p-dialog
    [header]="t('cases.newTitle')"
    [modal]="true"
    [(visible)]="visible"
    [style]="{ width: '32rem' }"
    [contentStyle]="{ 'max-height': '70vh' }"
  >
    <form novalidate class="flex flex-col gap-4 pt-2" (submit)="$event.preventDefault(); onCreate()">
      <!-- Said first, because it decides the rest: a case that did not come in by mail has no
           address, and neither the drafting run nor the send button will touch it. -->
      <p-floatlabel variant="on">
        <p-select
          inputId="new-case-channel"
          appendTo="body"
          class="w-full"
          [options]="channelOptions()"
          optionLabel="label"
          optionValue="value"
          [ngModel]="channel()"
          (ngModelChange)="channel.set($event)"
          name="channel"
        />
        <label for="new-case-channel">{{ t('cases.newChannel') }}</label>
      </p-floatlabel>

      <!-- Free text, not an address: a caller is a person with a number. -->
      <p-floatlabel variant="on">
        <input
          pInputText
          id="new-case-contact"
          type="text"
          class="w-full"
          [ngModel]="contact()"
          (ngModelChange)="contact.set($event)"
          name="contact"
        />
        <label for="new-case-contact">{{ t('cases.newContact') }}</label>
      </p-floatlabel>

      <p-floatlabel variant="on">
        <input
          pInputText
          id="new-case-subject"
          type="text"
          class="w-full"
          [ngModel]="subject()"
          (ngModelChange)="subject.set($event)"
          name="subject"
        />
        <label for="new-case-subject">{{ t('cases.newSubject') }}</label>
      </p-floatlabel>

      <p-floatlabel variant="on">
        <textarea
          pTextarea
          id="new-case-text"
          rows="6"
          class="w-full"
          [ngModel]="text()"
          (ngModelChange)="text.set($event)"
          name="text"
        ></textarea>
        <label for="new-case-text">{{ t('cases.newText') }}</label>
      </p-floatlabel>

      <!-- A scanned fax, a photo of a note. Picked here and sent with the case, so a case never
           stands without what belongs to it. -->
      <div class="flex flex-col gap-2">
        <p-fileupload
          mode="basic"
          [auto]="true"
          [customUpload]="true"
          [multiple]="true"
          [chooseLabel]="t('cases.newAttach')"
          chooseIcon="pi pi-paperclip"
          [chooseButtonProps]="{ severity: 'secondary', outlined: true }"
          [disabled]="busy()"
          (uploadHandler)="onPickFiles($event)"
        />
        @if (files().length > 0) {
          <ul class="flex flex-col gap-1 text-sm">
            @for (file of files(); track file) {
              <li class="flex items-center justify-between gap-2 rounded-lg bg-surface-50 px-3 py-1.5 dark:bg-surface-800">
                <span class="truncate">{{ file.name }}</span>
                <p-button
                  type="button"
                  icon="pi pi-times"
                  variant="text"
                  size="small"
                  severity="secondary"
                  [ariaLabel]="t('cases.newDetach', { name: file.name })"
                  (onClick)="onDropFile(file)"
                />
              </li>
            }
          </ul>
        }
      </div>

      <!-- Whoever took the call often knows who is to handle it, and often it is them. Nobody
           by default: taking a call is not the same as claiming the work. -->
      <p-floatlabel variant="on">
        <p-select
          inputId="new-case-assignee"
          appendTo="body"
          class="w-full"
          [options]="assigneeOptions()"
          optionLabel="label"
          optionValue="value"
          [ngModel]="assigneeId()"
          (ngModelChange)="assigneeId.set($event)"
          name="assigneeId"
        />
        <label for="new-case-assignee">{{ t('cases.assignee') }}</label>
      </p-floatlabel>

      <!-- Both may be left alone, and then the case goes through the triage like any other. -->
      <div class="flex flex-col gap-4 sm:flex-row">
        <p-floatlabel variant="on" class="flex-1">
          <p-select
            inputId="new-case-category"
            appendTo="body"
            class="w-full"
            [options]="categoryOptions()"
            optionLabel="label"
            optionValue="value"
            [ngModel]="categoryId()"
            (ngModelChange)="categoryId.set($event)"
            name="categoryId"
          />
          <label for="new-case-category">{{ t('caseDetail.category') }}</label>
        </p-floatlabel>
        <p-floatlabel variant="on" class="flex-1">
          <p-select
            inputId="new-case-tier"
            appendTo="body"
            class="w-full"
            [options]="tierOptions()"
            optionLabel="label"
            optionValue="value"
            [ngModel]="tier()"
            (ngModelChange)="tier.set($event)"
            name="tier"
          />
          <label for="new-case-tier">{{ t('caseDetail.tier') }}</label>
        </p-floatlabel>
      </div>
    </form>

    <!-- In the footer rather than under the form: the content scrolls once files are picked, and
         the way out must not scroll away with it. Enter in a field still submits the form above. -->
    <ng-template #footer>
      <p-button type="button" severity="secondary" [text]="true" [label]="t('cases.newCancel')" (onClick)="visible.set(false)" />
      <p-button type="button" [label]="t('cases.newSave')" [disabled]="!canCreate()" (onClick)="onCreate()" />
    </ng-template>
  </p-dialog>
</ng-container>
