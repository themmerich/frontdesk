<ng-container *transloco="let t">
  <div class="flex flex-col gap-2">
    @for (note of notes(); track note.id) {
      <article class="flex flex-col gap-1 rounded-lg bg-surface-50 p-2 text-sm dark:bg-surface-800">
        <div class="flex flex-wrap items-baseline justify-between gap-x-2 text-xs text-surface-500 dark:text-surface-400">
          <span class="font-medium text-surface-700 dark:text-surface-200">{{ note.authorName }}</span>
          <span>
            {{ note.createdAt | date: 'short' }}
            @if (note.updatedAt) {
              · {{ t('caseDetail.noteEdited') }}
            }
          </span>
        </div>

        @if (editingId() === note.id) {
          <textarea
            pTextarea
            rows="3"
            class="w-full text-sm"
            [ngModel]="editingText()"
            (ngModelChange)="editingText.set($event)"
            [attr.aria-label]="t('caseDetail.noteEdit')"
          ></textarea>
          <div class="flex justify-end gap-2">
            <p-button size="small" severity="secondary" [text]="true" [label]="t('caseDetail.noteCancel')" (onClick)="onCancelEdit()" />
            <p-button size="small" [label]="t('caseDetail.noteSave')" [disabled]="!canSaveEdit()" (onClick)="onSaveEdit()" />
          </div>
        } @else {
          <p class="whitespace-pre-wrap">{{ note.text }}</p>
          <!-- Only on one's own: a note belongs to whoever wrote it. -->
          @if (note.own) {
            <div class="flex justify-end gap-1">
              <p-button
                icon="pi pi-pencil"
                size="small"
                severity="secondary"
                [text]="true"
                [ariaLabel]="t('caseDetail.noteEdit')"
                (onClick)="onStartEdit(note)"
              />
              <p-button
                icon="pi pi-trash"
                size="small"
                severity="danger"
                [text]="true"
                [ariaLabel]="t('caseDetail.noteDelete')"
                (onClick)="removed.emit(note)"
              />
            </div>
          }
        }
      </article>
    }

    <textarea
      pTextarea
      rows="2"
      class="w-full text-sm"
      [ngModel]="draft()"
      (ngModelChange)="draft.set($event)"
      [placeholder]="t('caseDetail.notePlaceholder')"
      [attr.aria-label]="t('caseDetail.noteNew')"
    ></textarea>
    <div class="flex justify-end">
      <p-button size="small" [label]="t('caseDetail.noteAdd')" [disabled]="!canAdd()" (onClick)="onAdd()" />
    </div>
  </div>
</ng-container>
