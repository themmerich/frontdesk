spring.application.name=backend

# Flyway owns the schema; Hibernate only validates its mapping against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Sessions live in PostgreSQL (Spring Session JDBC); the tables come from a
# Flyway migration, so Spring Session's own schema initializer stays off.
spring.session.jdbc.initialize-schema=never

# Mailbox polled for incoming mail. Defaults match the GreenMail service in
# compose.yaml (auth disabled there, so any credentials work); point these at a
# real IMAP account via environment variables (FRONTDESK_MAIL_*) in production.
frontdesk.mail.host=localhost
frontdesk.mail.port=3143
frontdesk.mail.username=inbox@frontdesk.local
frontdesk.mail.password=secret
frontdesk.mail.folder=INBOX
frontdesk.mail.poll-interval=10s
frontdesk.mail.polling-enabled=true
