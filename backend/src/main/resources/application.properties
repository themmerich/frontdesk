spring.application.name=backend

# Flyway owns the schema; Hibernate only validates its mapping against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Sessions live in PostgreSQL (Spring Session JDBC); the tables come from a
# Flyway migration, so Spring Session's own schema initializer stays off.
spring.session.jdbc.initialize-schema=never

# Profile picture uploads: the endpoint enforces 2 MB, the multipart limits
# (Boot default: 1 MB) must not cut in below that.
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

# Mail polling cadence and global kill switch. Which mailbox each tenant's
# poll reads comes from its stored configuration (tenant_mail_settings), not
# from properties.
frontdesk.mail.poll-interval=10s
frontdesk.mail.polling-enabled=true

# Triage (roadmap step 2). The key itself is never in the repo: it goes into
# the git-ignored application-local.properties (see the .example beside it).
# Sonnet 5 rather than Haiku, because the classification is a judgement call
# about German business mail, and a wrong tier costs more than the difference.
spring.ai.anthropic.chat.options.model=claude-sonnet-5
# A classification answer is a handful of fields; this is a ceiling, not a target.
spring.ai.anthropic.chat.options.max-tokens=1024
# How often untriaged cases are picked up, and how many per run.
frontdesk.triage.enabled=true
frontdesk.triage.interval=30s
frontdesk.triage.batch-size=20
