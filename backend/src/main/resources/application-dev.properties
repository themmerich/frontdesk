# Dev-profile-only settings. The dev profile is activated by `./gradlew bootRun`
# (see build.gradle.kts); a packaged jar never has it, so nothing in here can
# leak into production.

# Seeds the demo tenant with admin@frontdesk.local / user@frontdesk.local
# (password: secret). Deliberately not in application.properties: that file
# ships in the jar, and demo credentials must never exist in production.
frontdesk.auth.seed-demo-data=true
