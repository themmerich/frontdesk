# Dev-profile-only settings. The dev profile is activated by `./gradlew bootRun`
# (see build.gradle.kts); a packaged jar never has it, so nothing in here can
# leak into production.

# Seeds the demo tenant with the users admin / user (password: secret).
# Deliberately not in application.properties: that file
# ships in the jar, and demo credentials must never exist in production.
frontdesk.auth.seed-demo-data=true

# Key material for stored secrets. Dev-only, like the demo credentials above:
# this file never ships in a jar, and a demo mailbox password is worth nothing.
frontdesk.crypto.secret=dev-only-not-a-real-secret
frontdesk.crypto.salt=5c0ffee5c0ffee5c
